<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580"><rect width="820" height="580" fill="#1e1e24" rx="12"/><style>.desc,.label{font-family:&quot;Pretendard&quot;,-apple-system,sans-serif}.label{font-size:13px;font-weight:700;fill:#fff}.desc{font-size:11px;fill:#abb2bf}.arrow,.box{stroke-width:1.5}.box{rx:8}.arrow{stroke:#5c6370;fill:none}.line-text{font-family:&quot;Pretendard&quot;,-apple-system,sans-serif;font-size:11px;font-weight:700;fill:#5c6370}</style><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="7" refY="3.5"><path d="M0 0 10 3.5 0 7z" style="fill:#5c6370"/></marker></defs><text x="30" y="45" style="font-family:&quot;Pretendard&quot;,-apple-system,sans-serif;font-size:20px;font-weight:700;fill:#fff">웹 브라우저에 URL 입력 시 인프라 흐름</text><path fill="#2d3139" stroke="#4f5969" d="M0 0H180V80H0z" class="box" transform="translate(40 110)"/><text x="15" y="28" class="label" transform="translate(40 110)">1. 웹 브라우저 (Client)</text><text x="15" y="48" class="desc" transform="translate(40 110)">사용자가 URL 입력</text><text x="15" y="65" class="desc" transform="translate(40 110)">(예: kdev.ing)</text><path fill="#2d3139" stroke="#4f5969" d="M0 0H180V80H0z" class="box" transform="translate(40 270)"/><text x="15" y="28" class="label" transform="translate(40 270)">2. DNS 조회</text><text x="15" y="48" class="desc" transform="translate(40 270)">도메인 주소를 IP 주소로</text><text x="15" y="65" class="desc" transform="translate(40 270)">변환하여 브라우저에 반환</text><path marker-end="url(#arrowhead)" d="M 110 190 L 110 260" class="arrow"/><path marker-end="url(#arrowhead)" d="M 150 270 L 150 200" class="arrow"/><path stroke="#3e4451" stroke-dasharray="5,5" d="M260 80 260 520"/><text x="270" y="75" class="line-text">외부 인터넷망 (Public, 예: 220.123.45.67)</text><path stroke="#c678dd" d="M0 0H210V310H0z" style="stroke-width:1.5;stroke-dasharray:4,4;rx:10;fill:none" transform="translate(290 110)"/><text x="15" y="-12" style="font-family:&quot;Pretendard&quot;,-apple-system,sans-serif;font-size:11px;font-weight:700;fill:#c678dd" transform="translate(290 110)">중간 교차 영역 (미들웨어)</text><path fill="#3a2f35" stroke="#e06c75" d="M0 0H180V60H0z" class="box" transform="translate(305 130)"/><text x="15" y="28" class="label" transform="translate(305 130)">3. WAF (웹 방화벽)</text><text x="15" y="48" class="desc" transform="translate(305 130)">해킹 &amp; 유해 트래픽 차단</text><path fill="#2c3b35" stroke="#98c379" d="M0 0H180V60H0z" class="box" transform="translate(305 230)"/><text x="15" y="28" class="label" transform="translate(305 230)">4. 로드밸런서</text><text x="15" y="48" class="desc" transform="translate(305 230)">트래픽을 여러 웹서버로 분산</text><path fill="#2d3139" stroke="#abb2bf" d="M0 0H180V60H0z" class="box" transform="translate(305 330)"/><text x="15" y="28" class="label" transform="translate(305 330)">5. 웹 서버 (Web)</text><text x="15" y="48" class="desc" transform="translate(305 330)">리버스 프록시 &amp; 정적 파일 제공</text><path marker-end="url(#arrowhead)" d="M 220 150 L 295 150" class="arrow"/><path marker-end="url(#arrowhead)" d="M 395 190 L 395 220" class="arrow"/><path marker-end="url(#arrowhead)" d="M 395 290 L 395 320" class="arrow"/><path stroke="#3e4451" stroke-dasharray="5,5" d="M530 80 530 520"/><text x="540" y="75" class="line-text">내부 사설망 (Private, 예: 10.0.1.20)</text><path fill="#2d3139" stroke="#61afef" d="M0 0H200V80H0z" class="box" transform="translate(560 110)"/><text x="15" y="28" class="label" transform="translate(560 110)">6. WAS (Application)</text><text x="15" y="48" class="desc" transform="translate(560 110)">동적 데이터 비즈니스 처리</text><text x="15" y="65" class="desc" transform="translate(560 110)">(Spring Boot 등)</text><path fill="#323842" stroke="#e5c07b" d="M0 0H200V80H0z" class="box" transform="translate(560 250)"/><text x="15" y="28" class="label" transform="translate(560 250)">7. DB 접근통제 (미들웨어)</text><text x="15" y="48" class="desc" transform="translate(560 250)">DBSAFER 등 보안 솔루션 거침</text><text x="15" y="65" class="desc" transform="translate(560 250)">비인가 쿼리 차단 및 감사 기록</text><path fill="#352e3b" stroke="#c678dd" d="M0 0H200V80H0z" class="box" transform="translate(560 390)"/><text x="15" y="28" class="label" transform="translate(560 390)">8. 데이터베이스 (DB)</text><text x="15" y="48" class="desc" transform="translate(560 390)">회원/결제 정보 등 핵심 적재</text><text x="15" y="65" class="desc" transform="translate(560 390)">(PostgreSQL 등)</text><path marker-end="url(#arrowhead)" d="M 485 360 L 550 150" class="arrow"/><path marker-end="url(#arrowhead)" d="M 660 190 L 660 240" class="arrow"/><path marker-end="url(#arrowhead)" d="M 660 330 L 660 380" class="arrow"/><path marker-end="url(#arrowhead)" d="M 640 390 L 640 340" class="arrow"/></svg>