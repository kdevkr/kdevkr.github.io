<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"><rect width="800" height="360" fill="#1e1e24" rx="12"/><style>.desc,.label{font-family:&quot;Pretendard&quot;,-apple-system,sans-serif}.label{font-size:14px;font-weight:700;fill:#fff}.desc{font-size:11px;fill:#abb2bf}.box{stroke-width:1.5;rx:8}.flow-line{stroke-width:2;fill:none}.arrow-text{font-family:&quot;Pretendard&quot;,-apple-system,sans-serif;font-size:11px;font-weight:700}</style><defs><marker id="arrow-blue" markerHeight="7" markerWidth="10" orient="auto" refX="6" refY="3.5"><path fill="#61afef" d="M0 0 10 3.5 0 7z"/></marker><marker id="arrow-green" markerHeight="7" markerWidth="10" orient="auto" refX="6" refY="3.5"><path fill="#98c379" d="M0 0 10 3.5 0 7z"/></marker></defs><text x="30" y="40" style="font-family:&quot;Pretendard&quot;,-apple-system,sans-serif;font-size:18px;font-weight:700;fill:#fff">API 와 Webhook 통신 방식의 차이</text><g transform="translate(60 100)"><path fill="#2d3139" stroke="#4f5969" d="M0 0H180V180H0z" class="box"/><text x="20" y="40" class="label">우리 서버 (자사)</text><text x="20" y="70" class="desc">우리가 운영하는 서비스</text><rect width="140" height="24" x="20" y="105" fill="#22262d" rx="4"/><text x="30" y="121" fill="#61afef" font-family="Pretendard" font-size="11" font-weight="bold">API: 주체적으로 요청</text><rect width="140" height="24" x="20" y="137" fill="#22262d" rx="4"/><text x="30" y="153" fill="#98c379" font-family="Pretendard" font-size="11" font-weight="bold">웹훅: 수동적으로 대기</text></g><g transform="translate(560 100)"><path fill="#2d3139" stroke="#4f5969" d="M0 0H180V180H0z" class="box"/><text x="20" y="40" class="label">외부 서버 (연계시스템)</text><text x="20" y="70" class="desc">결제창, 알림톡 솔루션 등</text><rect width="140" height="56" x="20" y="105" fill="#22262d" rx="4"/><text x="30" y="125" fill="#abb2bf" font-family="Pretendard" font-size="11">특정 상황 발생 감지</text><text x="30" y="145" fill="#abb2bf" font-family="Pretendard" font-size="11">(예: 결제 완료 시점)</text></g><path stroke="#61afef" marker-end="url(#arrow-blue)" d="M 240 130 L 550 130" class="flow-line"/><text x="280" y="120" fill="#61afef" class="arrow-text">① API 요청 (데이터 가져오기)</text><path stroke="#61afef" stroke-dasharray="4,2" marker-end="url(#arrow-blue)" d="M 560 160 L 250 160" class="flow-line"/><text x="280" y="180" fill="#61afef" class="arrow-text">② API 응답 (결과 데이터 반환)</text><path stroke="#3e4451" stroke-dasharray="5,5" d="M280 200 520 200"/><path stroke="#98c379" marker-end="url(#arrow-green)" d="M 560 240 L 250 240" class="flow-line"/><text x="280" y="230" fill="#98c379" class="arrow-text">① Webhook 호출 (결제 완료 등 알림 전송)</text><text x="280" y="260" fill="#98c379" font-family="Pretendard" font-size="10">(결제 완료 같은 상황이 생기면 외부에서 즉시 쏨)</text></svg>