<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 465"><rect width="840" height="465" fill="#1e1e24" rx="12"/><style>.subnet-title{font-size:11.5px;font-weight:700}.desc,.label,.subnet-title{font-family:&quot;Pretendard&quot;,-apple-system,sans-serif}.label{font-size:12px;font-weight:700;fill:#fff}.desc{font-size:10px;fill:#abb2bf}.box{stroke-width:1.5;rx:6}.arrow{stroke:#dcdfe4;stroke-width:2;fill:none}</style><defs><marker id="arrowhead" markerHeight="4" markerWidth="6" orient="auto" refX="5" refY="2"><path d="M0 0 6 2 0 4z" style="fill:#dcdfe4"/></marker><marker id="arrowhead-vpn" markerHeight="4" markerWidth="6" orient="auto" refX="5" refY="2"><path d="M0 0 6 2 0 4z" style="fill:#e5c07b"/></marker></defs><text x="30" y="40" style="font-family:&quot;Pretendard&quot;,-apple-system,sans-serif;font-size:19px;font-weight:700;fill:#fff">클라우드 가상 네트워크 (VPC) 내부망 구조</text><path fill="#2c313c" stroke="#5c6370" d="M0 0H130V90H0z" class="box" transform="translate(30 145)"/><text x="12" y="25" class="label" transform="translate(30 145)">외부 사용자 (인터넷)</text><text x="12" y="45" class="desc" transform="translate(30 145)">일반 고객 브라우저</text><text x="12" y="58" class="desc" transform="translate(30 145)">공인 IP 환경에서 접속</text><g transform="translate(180 75)"><rect width="630" height="345" fill="none" stroke="#61afef" stroke-dasharray="5,5" stroke-width="1.5" rx="10"/><text x="20" y="22" style="font-family:&quot;Pretendard&quot;,-apple-system,sans-serif;font-size:12px;font-weight:700;fill:#61afef">클라우드 가상망 공간 (VPC)</text></g><g transform="translate(195 110)"><rect width="295" height="290" fill="none" stroke="#98c379" stroke-width="1.5" rx="8"/><text x="15" y="22" fill="#98c379" class="subnet-title">퍼블릭 서브넷 (Public Subnet)</text><path fill="#2c313a" stroke="#98c379" d="M0 0H110V90H0z" class="box" transform="translate(15 35)"/><text x="12" y="25" class="label" transform="translate(15 35)">IGW</text><text x="12" y="45" class="desc" transform="translate(15 35)">인터넷 게이트웨이</text><text x="12" y="60" class="desc" transform="translate(15 35)">외부 인터넷 통로</text><path fill="#2d3139" stroke="#abb2bf" d="M0 0H115V90H0z" class="box" transform="translate(165 35)"/><text x="12" y="25" class="label" transform="translate(165 35)">웹서버</text><text x="12" y="45" class="desc" transform="translate(165 35)">외부 요청 1차 응대</text><text x="12" y="58" class="desc" transform="translate(165 35)">리버스 프록시 작동</text><path fill="#2d3139" stroke="#e06c75" d="M0 0H265V110H0z" class="box" transform="translate(15 160)"/><text x="15" y="25" class="label" transform="translate(15 160)">NAT 게이트웨이</text><text x="15" y="45" class="desc" transform="translate(15 160)">프라이빗 서브넷에 위치한 서버들이</text><text x="15" y="58" class="desc" transform="translate(15 160)">외부 통신이 필요할 때 중계해주는 임시 통로</text><text x="15" y="71" class="desc" transform="translate(15 160)">(예: 외부 라이브러리 보안 패치 등)</text><text x="15" y="92" fill="#e5c07b" class="ip" font-family="Courier New" font-size="10.5" font-weight="bold" transform="translate(15 160)">➔ 외부인터넷망으로 연결</text></g><g transform="translate(505 110)"><rect width="290" height="290" fill="none" stroke="#e06c75" stroke-width="1.5" rx="8"/><text x="15" y="22" fill="#e06c75" class="subnet-title">프라이빗 서브넷 (Private Subnet)</text><path fill="#2d3139" stroke="#61afef" d="M0 0H260V90H0z" class="box" transform="translate(15 35)"/><text x="15" y="25" class="label" transform="translate(15 35)">WAS 서버 (애플리케이션)</text><text x="15" y="45" class="desc" transform="translate(15 35)">비즈니스 로직 연산 및 DB 조회 처리</text><text x="15" y="58" class="desc" transform="translate(15 35)">외부 접속 원천 차단 (사설 IP 사용)</text><path fill="#352e3b" stroke="#c678dd" d="M0 0H260V110H0z" class="box" transform="translate(15 160)"/><text x="15" y="25" class="label" transform="translate(15 160)">데이터베이스 (DB)</text><text x="15" y="45" class="desc" transform="translate(15 160)">핵심 데이터 보관 안전 금고</text><text x="15" y="58" class="desc" transform="translate(15 160)">외부 접근이 불가능한 가장 깊숙한 망</text><text x="15" y="75" class="desc" transform="translate(15 160)">DB접근제어 솔루션(DBSAFER) 통제</text></g><g transform="translate(30 260)"><path fill="#2c313c" stroke="#e5c07b" d="M0 0H130V110H0z" class="box"/><text x="12" y="25" fill="#e5c07b" class="label">회사 컴퓨터</text><text x="12" y="45" class="desc">개발자 또는 운영 PC</text><text x="12" y="58" class="desc">사무실 및 재택 근무</text><rect width="110" height="25" x="10" y="75" fill="#3b3225" rx="4"/><text x="16" y="92" fill="#e5c07b" font-family="Pretendard" font-size="10.5" font-weight="bold">VPN 안전 접속</text></g><path marker-end="url(#arrowhead)" d="M 160 190 H 205" class="arrow"/><path marker-end="url(#arrowhead)" d="M 320 190 H 353" class="arrow"/><path marker-end="url(#arrowhead)" d="M 475 190 H 513" class="arrow"/><path marker-end="url(#arrowhead)" d="M 640 235 V 270" class="arrow"/><path marker-end="url(#arrowhead)" d="M 620 270 V 235" class="arrow"/><path marker-end="url(#arrowhead)" d="M 520 190 H 500 V 300 H 480" class="arrow"/><path marker-end="url(#arrowhead-vpn)" d="M 160 350 H 175 V 430 H 650 V 385" style="stroke:#e5c07b;stroke-width:2.5;stroke-dasharray:4,3;fill:none"/><text x="210" y="445" fill="#e5c07b" style="font-family:&quot;Pretendard&quot;,-apple-system,sans-serif;font-size:10px;font-weight:700">VPN 암호화 터널: 회사 컴퓨터에서 프라이빗 망으로 안전하게 직접 연결</text></svg>