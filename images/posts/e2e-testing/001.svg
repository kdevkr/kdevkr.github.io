ard-title">기능 및 시나리오</text><rect width="148" height="24" x="18" y="74" fill="#0f172a" stroke="#0284c7" rx="6"/><text x="28" y="90" fill="#38bdf8" class="tool-badge">e2e + Playwright</text><text x="18" y="124" class="card-desc">자연어 목표 탐색 및 로케이터 검증</text></g><path stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" d="M282 132 310 132"/><g filter="url(#cardShadow)" transform="translate(322 60)"><rect width="235" height="145" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="10"/><rect width="235" height="4" fill="url(#step2Grad)" rx="2"/><text x="18" y="32" fill="#c084fc" class="step-tag">STEP 02</text><text x="18" y="56" class="card-title">웹 접근성 감사</text><rect width="88" height="24" x="18" y="74" fill="#0f172a" stroke="#7c3aed" rx="6"/><text x="28" y="90" fill="#c084fc" class="tool-badge">axe-core</text><text x="18" y="124" class="card-desc">WCAG 가이드라인 및 a11y 표준 검사</text></g><path stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" d="M572 132 600 132"/><g filter="url(#cardShadow)" transform="translate(612 60)"><rect width="235" height="145" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="10"/><rect width="235" height="4" fill="url(#step3Grad)" rx="2"/><text x="18" y="32" fill="#34d399" class="step-tag">STEP 03</text><text x="18" y="56" class="card-title">부하 및 성능 테스트</text><rect width="46" height="24" x="18" y="74" fill="#0f172a" stroke="#059669" rx="6"/><text x="28" y="90" fill="#34d399" class="tool-badge">k6</text><text x="18" y="124" class="card-desc">동시 접속 트래픽 및 응답 임계치 측정</text></g></svg>