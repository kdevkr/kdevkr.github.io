<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320"><defs><marker id="arrowhead-lb" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#6366f1" d="M0 0 8 3 0 6z"/></marker><marker id="arrowhead-server" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#0ea5e9" d="M0 0 8 3 0 6z"/></marker><style>.box-server{fill:#0f2942;stroke:#0ea5e9;stroke-width:1.5;rx:8px}.text-badge,.text-main,.text-sub,.text-tag{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;text-anchor:middle}.text-main{fill:#f1f5f9;font-size:14px;font-weight:600}.text-badge{font-size:11px}.text-sub{fill:#cbd5e1}.text-sub,.text-tag{font-size:11px}.text-badge,.text-tag{fill:#a5b4fc;font-weight:600}.text-tag{fill:#38bdf8}.arrow-line-server{stroke:#0ea5e9;stroke-width:2;fill:none}</style></defs><path d="M0 0H760V320H0z" style="fill:#0f172a;rx:12px"/><text x="30" y="36" style="fill:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;font-size:16px;font-weight:700">L4 로드밸런서 동작 방식</text><text x="30" y="56" style="fill:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;font-size:12px">IP 주소 및 TCP/UDP 포트 정보를 기반으로 전송 계층에서 패킷 분산</text><path d="M0 0H120V110H0z" style="fill:#1e293b;stroke:#334155;stroke-width:1.5;rx:8px" transform="translate(40 110)"/><text x="60" y="45" class="text-main" transform="translate(40 110)">클라이언트</text><text x="60" y="70" class="text-sub" transform="translate(40 110)">Client Request</text><text x="60" y="88" class="text-sub" transform="translate(40 110)">(TCP / IP)</text><path marker-end="url(#arrowhead-lb)" d="M 160 165 L 250 165" style="stroke:#6366f1;stroke-width:2;fill:none"/><rect width="60" height="18" x="175" y="148" fill="#1e1b4b" stroke="#6366f1" rx="4"/><text x="205" y="161" class="text-badge">IP:Port</text><g transform="translate(260 95)"><path d="M0 0H160V140H0z" style="fill:#1e1b4b;stroke:#6366f1;stroke-width:2;rx:8px"/><rect width="130" height="22" x="15" y="15" fill="#4338ca" rx="4"/><text x="80" y="30" fill="#fff" class="text-badge">L4 Load Balancer</text><text x="80" y="68" class="text-main">패킷 수신 &amp; 전달</text><text x="80" y="92" class="text-sub">IP: 192.168.1.100</text><text x="80" y="112" class="text-sub">Port: 80 / 443</text></g><path marker-end="url(#arrowhead-server)" d="M 420 135 L 530 95" class="arrow-line-server"/><path marker-end="url(#arrowhead-server)" d="M 420 195 L 530 235" class="arrow-line-server"/><path d="M0 0H170V90H0z" class="box-server" transform="translate(540 50)"/><text x="85" y="38" class="text-main" transform="translate(540 50)">백엔드 서버 A</text><text x="85" y="62" class="text-tag" transform="translate(540 50)">10.0.0.10:8080</text><path d="M0 0H170V90H0z" class="box-server" transform="translate(540 190)"/><text x="85" y="38" class="text-main" transform="translate(540 190)">백엔드 서버 B</text><text x="85" y="62" class="text-tag" transform="translate(540 190)">10.0.0.11:8080</text></svg>