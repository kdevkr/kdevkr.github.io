<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380"><defs><marker id="arrowhead-lb" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#8b5cf6" d="M0 0 8 3 0 6z"/></marker><marker id="arrowhead-t1" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#38bdf8" d="M0 0 8 3 0 6z"/></marker><marker id="arrowhead-t2" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#a855f7" d="M0 0 8 3 0 6z"/></marker><marker id="arrowhead-t3" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#64748b" d="M0 0 8 3 0 6z"/></marker><style>.text-main,.text-sub{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;text-anchor:middle}.text-main{fill:#f1f5f9;font-size:14px;font-weight:600}.text-sub{fill:#cbd5e1;font-size:11px}.arrow-line-t1{stroke:#38bdf8;stroke-width:2;fill:none}</style></defs><path d="M0 0H780V380H0z" style="fill:#0f172a;rx:12px"/><text x="30" y="36" style="fill:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;font-size:16px;font-weight:700">L7 로드밸런서 동작 방식 (SaaS 다중 테넌트 헤더 라우팅)</text><text x="30" y="56" style="fill:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;font-size:12px">HTTP 요청 헤더의 테넌트 ID(X-Tenant-ID) 정보를 기반으로 해당 전용 서버로 트래픽 분기</text><g transform="translate(30 120)"><path d="M0 0H140V150H0z" style="fill:#1e293b;stroke:#334155;stroke-width:1.5;rx:8px"/><text x="70" y="35" class="text-main">클라이언트 요청</text><rect width="120" height="24" x="10" y="50" fill="#0369a1" rx="4"/><text x="70" y="66" fill="#bae6fd" class="text-sub">X-Tenant-ID: tenant-a</text><rect width="120" height="24" x="10" y="82" fill="#581c87" rx="4"/><text x="70" y="98" fill="#e9d5ff" class="text-sub">X-Tenant-ID: tenant-b</text><rect width="120" height="24" x="10" y="114" fill="#334155" rx="4"/><text x="70" y="130" fill="#cbd5e1" class="text-sub">X-Tenant-ID: shared</text></g><path marker-end="url(#arrowhead-lb)" d="M 170 195 L 250 195" class="arrow-line-t1"/><g transform="translate(260 105)"><path d="M0 0H190V180H0z" style="fill:#1e1b4b;stroke:#8b5cf6;stroke-width:2;rx:8px"/><rect width="160" height="24" x="15" y="15" fill="#6d28d9" rx="4"/><text x="95" y="31" style="fill:#c4b5fd;font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;font-size:11px;font-weight:600;text-anchor:middle">L7 Load Balancer</text><rect width="160" height="118" x="15" y="48" fill="#0f172a" stroke="#4c1d95" rx="4"/><text x="95" y="66" fill="#a78bfa" class="text-sub">Tenant ID Header 분석</text><text x="95" y="90" fill="#7dd3fc" class="text-sub">tenant-a → 테넌트 A 전용</text><text x="95" y="115" fill="#c084fc" class="text-sub">tenant-b → 테넌트 B 전용</text><text x="95" y="140" fill="#94a3b8" class="text-sub">shared → 공용 서버 그룹</text></g><path marker-end="url(#arrowhead-t1)" d="M 450 145 L 540 85" class="arrow-line-t1"/><path marker-end="url(#arrowhead-t2)" d="M 450 195 L 540 195" style="stroke:#a855f7;stroke-width:2;fill:none"/><path marker-end="url(#arrowhead-t3)" d="M 450 245 L 540 305" style="stroke:#64748b;stroke-width:2;fill:none"/><g transform="translate(550 45)"><rect width="190" height="80" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" rx="8"/><text x="95" y="35" class="text-main">테넌트 A 전용 클러스터</text><text x="95" y="58" fill="#7dd3fc" class="text-sub">tenant-a 격리 인프라</text></g><g transform="translate(550 155)"><rect width="190" height="80" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" rx="8"/><text x="95" y="35" class="text-main">테넌트 B 전용 클러스터</text><text x="95" y="58" fill="#c084fc" class="text-sub">tenant-b 격리 인프라</text></g><g transform="translate(550 265)"><rect width="190" height="80" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="8"/><text x="95" y="35" class="text-main">공용 멀티 테넌트 서버</text><text x="95" y="58" fill="#cbd5e1" class="text-sub">일반 테넌트 수용 서버</text></g></svg>