<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450"><style>.label,.sub-label{font-family:&quot;Inter&quot;,system-ui,sans-serif}.label{font-weight:600;font-size:13px;fill:#f8fafc}.sub-label{font-size:11px;fill:#cbd5e1}.box-app{fill:#0f766e;stroke:#14b8a6;stroke-width:2;rx:6}</style><rect width="100%" height="100%" fill="#0b0f19" rx="16"/><text x="25" y="35" style="font-family:&quot;Inter&quot;,system-ui,sans-serif;font-weight:700;font-size:15px;fill:#f8fafc">현대 IT 인프라 구동 아키텍처</text><text x="25" y="52" style="font-family:&quot;Inter&quot;,system-ui,sans-serif;font-size:11px;fill:#64748b">가상 머신(VM)과 컨테이너 런타임의 계층 구조</text><path d="M0 280H400V325H0z" style="fill:#1e293b;stroke:#475569;stroke-width:2;rx:8" transform="translate(50 80)"/><text x="200" y="307" class="label" text-anchor="middle" transform="translate(50 80)">물리 하드웨어 (Bare-metal CPU / Memory)</text><path d="M0 225H400V270H0z" style="fill:#0369a1;stroke:#0ea5e9;stroke-width:2;rx:8" transform="translate(50 80)"/><text x="200" y="252" class="label" text-anchor="middle" transform="translate(50 80)">하이퍼바이저 (Type 1 - KVM / ESXi 등)</text><path d="M15 0H385V215H15z" style="fill:#1e1b4b;stroke:#4f46e5;stroke-dasharray:4,4;stroke-width:2;rx:12" transform="translate(50 80)"/><text x="375" y="22" class="sub-label" text-anchor="end" transform="translate(50 80)">클라우드 가상 머신 (VM)</text><path d="M35 150H365V195H35z" style="fill:#334155;stroke:#64748b;stroke-width:2;rx:8" transform="translate(50 80)"/><text x="200" y="177" class="label" text-anchor="middle" transform="translate(50 80)">게스트 OS (Linux Kernel 등)</text><path d="M35 95H365V140H35z" style="fill:#b45309;stroke:#f59e0b;stroke-width:2;rx:8" transform="translate(50 80)"/><text x="200" y="122" class="label" text-anchor="middle" transform="translate(50 80)">컨테이너 런타임 (Docker / containerd / CRI-O)</text><path d="M35 35H190V85H35z" class="box-app" transform="translate(50 80)"/><text x="112.5" y="60" class="label" text-anchor="middle" transform="translate(50 80)">컨테이너 앱 A</text><text x="112.5" y="74" class="sub-label" text-anchor="middle" transform="translate(50 80)">(Application &amp; Libs)</text><path d="M210 35H365V85H210z" class="box-app" transform="translate(50 80)"/><text x="287.5" y="60" class="label" text-anchor="middle" transform="translate(50 80)">컨테이너 앱 B</text><text x="287.5" y="74" class="sub-label" text-anchor="middle" transform="translate(50 80)">(Application &amp; Libs)</text></svg>