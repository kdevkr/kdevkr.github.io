<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Node Gradient Fills -->
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
  </defs>

  <style>
    .node-title { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .node-sub { font-family: 'Pretendard', sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .flow-tag { font-family: 'Pretendard', sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
    .prep-tag { font-family: 'Pretendard', sans-serif; font-size: 11px; font-weight: 700; fill: #34d399; }
  </style>

  <!-- Canvas Background -->
  <rect width="880" height="340" rx="14" fill="url(#bgGrad)" />
  <rect width="878" height="338" x="1" y="1" rx="13" fill="none" stroke="#334155" stroke-width="1.2" />

  <!-- ========================================== -->
  <!-- 1. 사용자 (User) -->
  <!-- ========================================== -->
  <g transform="translate(40, 110)" filter="url(#cardShadow)">
    <rect width="140" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="70" cy="46" r="22" fill="url(#userGrad)" />
    <!-- User Icon -->
    <path d="M70 38 A 7 7 0 1 0 70 52 A 7 7 0 1 0 70 38 Z M60 58 C 60 53 64 51 70 51 C 76 51 80 53 80 58 Z" fill="#ffffff" />
    
    <text x="70" y="92" text-anchor="middle" class="node-title">사용자</text>
    <text x="70" y="112" text-anchor="middle" class="node-sub">다국어 질의</text>
  </g>

  <!-- Flow: User <-> Service -->
  <g transform="translate(180, 145)">
    <!-- Request Arrow -->
    <path d="M 8 15 L 48 15" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="28" y="6" text-anchor="middle" class="flow-tag" fill="#38bdf8">질문</text>

    <!-- Response Arrow -->
    <path d="M 48 65 L 8 65" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-gray)" />
    <text x="28" y="86" text-anchor="middle" class="flow-tag" fill="#94a3b8">답변</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. 서비스 챗봇 UI (Service App) -->
  <!-- ========================================== -->
  <g transform="translate(240, 110)" filter="url(#cardShadow)">
    <rect width="150" height="150" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="75" cy="46" r="22" fill="url(#appGrad)" />
    <!-- Chat UI Icon -->
    <rect x="63" y="37" width="24" height="16" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8" />
    <line x1="68" y1="43" x2="82" y2="43" stroke="#ffffff" stroke-width="1.5" />
    <line x1="68" y1="47" x2="78" y2="47" stroke="#ffffff" stroke-width="1.5" />

    <text x="75" y="92" text-anchor="middle" class="node-title">서비스 챗봇 UI</text>
    <text x="75" y="112" text-anchor="middle" class="node-sub">웹 / 모바일 앱</text>
  </g>

  <!-- Flow: Service <-> Gemini -->
  <g transform="translate(390, 145)">
    <!-- API Call -->
    <path d="M 8 15 L 48 15" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arr-indigo)" />
    <text x="28" y="6" text-anchor="middle" class="flow-tag" fill="#818cf8">호출</text>

    <!-- API Response -->
    <path d="M 48 65 L 8 65" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-gray)" />
    <text x="28" y="86" text-anchor="middle" class="flow-tag" fill="#94a3b8">응답</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. Gemini API -->
  <!-- ========================================== -->
  <g transform="translate(450, 110)" filter="url(#cardShadow)">
    <rect width="150" height="150" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="75" cy="46" r="22" fill="url(#geminiGrad)" />
    <!-- AI Sparkle Icon -->
    <path d="M75 34 L77 43 L86 45 L77 47 L75 56 L73 47 L64 45 L73 43 Z" fill="#ffffff" />

    <text x="75" y="92" text-anchor="middle" class="node-title">Gemini API</text>
    <text x="75" y="112" text-anchor="middle" class="node-sub">Interactions API</text>
    <text x="75" y="130" text-anchor="middle" class="node-sub" fill="#c084fc">tools: [file_search]</text>
  </g>

  <!-- Flow: Gemini <-> File Search Store -->
  <g transform="translate(600, 145)">
    <!-- Search Query -->
    <path d="M 8 15 L 48 15" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald)" />
    <text x="28" y="6" text-anchor="middle" class="flow-tag" fill="#34d399">검색</text>

    <!-- Context Result -->
    <path d="M 48 65 L 8 65" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-gray)" />
    <text x="28" y="86" text-anchor="middle" class="flow-tag" fill="#94a3b8">문서</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. File Search Store (Knowledge Base) -->
  <!-- ========================================== -->
  <g transform="translate(660, 90)" filter="url(#cardShadow)">
    <!-- Container Box -->
    <rect width="180" height="190" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    
    <!-- Top Badge -->
    <rect x="14" y="14" width="152" height="24" rx="6" fill="#064e3b" />
    <text x="90" y="30" text-anchor="middle" class="prep-tag">사전 준비: 매뉴얼 등록</text>

    <circle cx="90" cy="78" r="20" fill="url(#storeGrad)" />
    <!-- Book/Doc Icon -->
    <path d="M83 71 L97 71 L97 85 L83 85 Z M85 75 L93 75 M85 78 L93 78" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />

    <text x="90" y="122" text-anchor="middle" class="node-title">File Search Store</text>
    <text x="90" y="142" text-anchor="middle" class="node-sub">사용자 매뉴얼 문서</text>
    <text x="90" y="162" text-anchor="middle" class="node-sub" fill="#34d399">RAG 지식 저장소</text>
  </g>

  <!-- Bottom Subtitle / Info -->
  <g transform="translate(40, 295)">
    <circle cx="8" cy="8" r="3" fill="#94a3b8" />
    <text x="20" y="12" class="node-sub" fill="#94a3b8">사용자가 질문하면 Gemini가 사전 등록된 사용자 매뉴얼(File Search Store)을 검색해 답변을 생성합니다.</text>
  </g>
</svg>
