<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="100%" height="100%">
  <!-- 배경 -->
  <rect width="820" height="580" rx="12" fill="#1e1e24"/>
  
  <!-- 스타일 -->
  <style>
    .title { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 20px; font-weight: bold; fill: #ffffff; }
    .label { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
    .desc { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 11px; fill: #abb2bf; }
    .box { stroke-width: 1.5; rx: 8; }
    .group-box { stroke-width: 1.5; stroke-dasharray: 4,4; rx: 10; fill: none; }
    .arrow { stroke: #5c6370; stroke-width: 1.5; fill: none; }
    .marker { fill: #5c6370; }
    .line-text { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #5c6370; }
    .group-label { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #c678dd; }
  </style>

  <!-- 마커 정의 (화살표용) -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="marker"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="30" y="45" class="title">웹 브라우저에 URL 입력 시 인프라 흐름</text>

  <!-- 1. 브라우저 -->
  <g transform="translate(40, 110)">
    <rect width="180" height="80" class="box" fill="#2d3139" stroke="#4f5969"/>
    <text x="15" y="28" class="label">1. 웹 브라우저 (Client)</text>
    <text x="15" y="48" class="desc">사용자가 URL 입력</text>
    <text x="15" y="65" class="desc">(예: kdev.ing)</text>
  </g>

  <!-- 2. DNS -->
  <g transform="translate(40, 270)">
    <rect width="180" height="80" class="box" fill="#2d3139" stroke="#4f5969"/>
    <text x="15" y="28" class="label">2. DNS 조회</text>
    <text x="15" y="48" class="desc">도메인 주소를 IP 주소로</text>
    <text x="15" y="65" class="desc">변환하여 브라우저에 반환</text>
  </g>

  <!-- 화살표: 브라우저 <-> DNS -->
  <path d="M 110 190 L 110 260" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 150 270 L 150 200" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- 퍼블릭 영역 구분 선 -->
  <line x1="260" y1="80" x2="260" y2="520" stroke="#3e4451" stroke-dasharray="5,5"/>
  <text x="270" y="75" class="line-text">외부 인터넷망 (Public, 예: 220.123.45.67)</text>

  <!-- 미들웨어 그룹 영역 -->
  <g transform="translate(290, 110)">
    <rect width="210" height="310" class="group-box" stroke="#c678dd"/>
    <text x="15" y="-12" class="group-label">중간 교차 영역 (미들웨어)</text>
  </g>

  <!-- 3. WAF -->
  <g transform="translate(305, 130)">
    <rect width="180" height="60" class="box" fill="#3a2f35" stroke="#e06c75"/>
    <text x="15" y="28" class="label">3. WAF (웹 방화벽)</text>
    <text x="15" y="48" class="desc">해킹 &amp; 유해 트래픽 차단</text>
  </g>

  <!-- 4. Load Balancer -->
  <g transform="translate(305, 230)">
    <rect width="180" height="60" class="box" fill="#2c3b35" stroke="#98c379"/>
    <text x="15" y="28" class="label">4. 로드밸런서</text>
    <text x="15" y="48" class="desc">트래픽을 여러 웹서버로 분산</text>
  </g>

  <!-- 5. Web Server -->
  <g transform="translate(305, 330)">
    <rect width="180" height="60" class="box" fill="#2d3139" stroke="#abb2bf"/>
    <text x="15" y="28" class="label">5. 웹 서버 (Web)</text>
    <text x="15" y="48" class="desc">리버스 프록시 &amp; 정적 파일 제공</text>
  </g>

  <!-- 화살표: 브라우저 -> WAF -> LB -> Web -->
  <path d="M 220 150 L 295 150" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 395 190 L 395 220" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 395 290 L 395 320" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- 프라이빗 영역 구분 선 -->
  <line x1="530" y1="80" x2="530" y2="520" stroke="#3e4451" stroke-dasharray="5,5"/>
  <text x="540" y="75" class="line-text">내부 사설망 (Private, 예: 10.0.1.20)</text>

  <!-- 6. WAS (Application Server) -->
  <g transform="translate(560, 110)">
    <rect width="200" height="80" class="box" fill="#2d3139" stroke="#61afef"/>
    <text x="15" y="28" class="label">6. WAS (Application)</text>
    <text x="15" y="48" class="desc">동적 데이터 비즈니스 처리</text>
    <text x="15" y="65" class="desc">(Spring Boot 등)</text>
  </g>

  <!-- 7. DB 접근제어 (DBSAFER) - 미들웨어 -->
  <g transform="translate(560, 250)">
    <rect width="200" height="80" class="box" fill="#323842" stroke="#e5c07b"/>
    <text x="15" y="28" class="label">7. DB 접근통제 (미들웨어)</text>
    <text x="15" y="48" class="desc">DBSAFER 등 보안 솔루션 거침</text>
    <text x="15" y="65" class="desc">비인가 쿼리 차단 및 감사 기록</text>
  </g>

  <!-- 8. Database -->
  <g transform="translate(560, 390)">
    <rect width="200" height="80" class="box" fill="#352e3b" stroke="#c678dd"/>
    <text x="15" y="28" class="label">8. 데이터베이스 (DB)</text>
    <text x="15" y="48" class="desc">회원/결제 정보 등 핵심 적재</text>
    <text x="15" y="65" class="desc">(PostgreSQL 등)</text>
  </g>

  <!-- 화살표: Web -> WAS -> DB접근제어 <-> DB -->
  <path d="M 485 360 L 550 150" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 660 190 L 660 240" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 660 330 L 660 380" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 640 390 L 640 340" class="arrow" marker-end="url(#arrowhead)"/>
</svg>
