<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <!-- 배경 -->
  <rect width="800" height="360" rx="12" fill="#1e1e24"/>
  
  <!-- 스타일 -->
  <style>
    .title { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 18px; font-weight: bold; fill: #ffffff; }
    .label { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
    .desc { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 11px; fill: #abb2bf; }
    .box { stroke-width: 1.5; rx: 8; }
    .flow-line { stroke-width: 2; fill: none; }
    .arrow-text { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 11px; font-weight: bold; }
  </style>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#61afef"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#98c379"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="30" y="40" class="title">API 와 Webhook 통신 방식의 차이</text>

  <!-- 우리 서버 -->
  <g transform="translate(60, 100)">
    <rect width="180" height="180" class="box" fill="#2d3139" stroke="#4f5969"/>
    <text x="20" y="40" class="label">우리 서버 (자사)</text>
    <text x="20" y="70" class="desc">우리가 운영하는 서비스</text>
    
    <!-- API 설명 뱃지 -->
    <rect x="20" y="105" width="140" height="24" rx="4" fill="#22262d"/>
    <text x="30" y="121" font-family="Pretendard" font-size="11" fill="#61afef" font-weight="bold">API: 주체적으로 요청</text>

    <!-- Webhook 설명 뱃지 -->
    <rect x="20" y="137" width="140" height="24" rx="4" fill="#22262d"/>
    <text x="30" y="153" font-family="Pretendard" font-size="11" fill="#98c379" font-weight="bold">웹훅: 수동적으로 대기</text>
  </g>

  <!-- 외부 연계 시스템 -->
  <g transform="translate(560, 100)">
    <rect width="180" height="180" class="box" fill="#2d3139" stroke="#4f5969"/>
    <text x="20" y="40" class="label">외부 서버 (연계시스템)</text>
    <text x="20" y="70" class="desc">결제창, 알림톡 솔루션 등</text>
    
    <!-- API/Webhook 뱃지 -->
    <rect x="20" y="105" width="140" height="56" rx="4" fill="#22262d"/>
    <text x="30" y="125" font-family="Pretendard" font-size="11" fill="#abb2bf">특정 상황 발생 감지</text>
    <text x="30" y="145" font-family="Pretendard" font-size="11" fill="#abb2bf">(예: 결제 완료 시점)</text>
  </g>

  <!-- [API 흐름] -->
  <!-- 1. 요청 화살표 (우리 -> 외부) -->
  <path d="M 240 130 L 550 130" class="flow-line" stroke="#61afef" marker-end="url(#arrow-blue)"/>
  <text x="280" y="120" class="arrow-text" fill="#61afef">① API 요청 (데이터 가져오기)</text>

  <!-- 2. 응답 화살표 (외부 -> 우리) -->
  <path d="M 560 160 L 250 160" class="flow-line" stroke="#61afef" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>
  <text x="280" y="180" class="arrow-text" fill="#61afef">② API 응답 (결과 데이터 반환)</text>

  <line x1="280" y1="200" x2="520" y2="200" stroke="#3e4451" stroke-dasharray="5,5"/>

  <!-- [Webhook 흐름] -->
  <!-- 3. 푸시 화살표 (외부 -> 우리) -->
  <path d="M 560 240 L 250 240" class="flow-line" stroke="#98c379" marker-end="url(#arrow-green)"/>
  <text x="280" y="230" class="arrow-text" fill="#98c379">① Webhook 호출 (결제 완료 등 알림 전송)</text>
  <text x="280" y="260" font-family="Pretendard" font-size="10" fill="#98c379">(결제 완료 같은 상황이 생기면 외부에서 즉시 쏨)</text>
</svg>
