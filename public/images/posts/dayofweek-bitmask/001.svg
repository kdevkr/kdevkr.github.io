<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="알림 수신 시간대 설정 UI 목업">
  <defs>
    <style>
      .bg     { fill: #fafafa; }
      .card   { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
      .label  { fill: #111827; font-family: 'Pretendard', system-ui, sans-serif; font-size: 14px; font-weight: 600; }
      .sub    { fill: #6b7280; font-family: 'Pretendard', system-ui, sans-serif; font-size: 12px; }
      .day    { font-family: 'Pretendard', system-ui, sans-serif; font-size: 14px; font-weight: 500; }
      .day-on  { fill: #ffffff; }
      .day-off { fill: #374151; }
      .ring-on  { fill: #2563eb; stroke: none; }
      .ring-off { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .input  { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .time   { fill: #111827; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px; }
      .tilde  { fill: #9ca3af; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 18px; }
      .summary { fill: #2563eb; font-family: 'Pretendard', system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    </style>
  </defs>

  <rect class="bg" width="640" height="360"/>

  <!-- Card -->
  <rect class="card" x="40" y="40" width="560" height="280" rx="12"/>

  <!-- Header -->
  <text class="label" x="64" y="78">알림 수신 시간대</text>
  <text class="sub"   x="64" y="98">알림을 받을 요일과 시간 범위를 선택하세요.</text>

  <!-- Day toggles: 일 월 화 수 목 금 토   |   active: 월 수 금 -->
  <text class="sub" x="64" y="138">요일</text>

  <!-- 일 (off) -->
  <circle class="ring-off" cx="84"  cy="170" r="18"/>
  <text class="day day-off" x="84"  y="175" text-anchor="middle">일</text>
  <!-- 월 (on) -->
  <circle class="ring-on"  cx="128" cy="170" r="18"/>
  <text class="day day-on"  x="128" y="175" text-anchor="middle">월</text>
  <!-- 화 (off) -->
  <circle class="ring-off" cx="172" cy="170" r="18"/>
  <text class="day day-off" x="172" y="175" text-anchor="middle">화</text>
  <!-- 수 (on) -->
  <circle class="ring-on"  cx="216" cy="170" r="18"/>
  <text class="day day-on"  x="216" y="175" text-anchor="middle">수</text>
  <!-- 목 (off) -->
  <circle class="ring-off" cx="260" cy="170" r="18"/>
  <text class="day day-off" x="260" y="175" text-anchor="middle">목</text>
  <!-- 금 (on) -->
  <circle class="ring-on"  cx="304" cy="170" r="18"/>
  <text class="day day-on"  x="304" y="175" text-anchor="middle">금</text>
  <!-- 토 (off) -->
  <circle class="ring-off" cx="348" cy="170" r="18"/>
  <text class="day day-off" x="348" y="175" text-anchor="middle">토</text>

  <!-- Time range -->
  <text class="sub" x="64" y="222">시간 범위</text>

  <rect class="input" x="64"  y="234" width="120" height="40" rx="8"/>
  <text class="time"  x="124" y="260" text-anchor="middle">09:00</text>

  <text class="tilde" x="200" y="261" text-anchor="middle">~</text>

  <rect class="input" x="216" y="234" width="120" height="40" rx="8"/>
  <text class="time"  x="276" y="260" text-anchor="middle">18:00</text>

  <!-- Summary -->
  <text class="summary" x="64" y="300">월·수·금 09:00 ~ 18:00 에 알림을 받습니다.</text>
</svg>
