<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Card Accent Gradients -->
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .step-tag { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .card-title { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .tool-badge { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
    .card-desc { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" rx="14" fill="url(#bgGrad)" />

  <!-- Section Header -->
  <text x="32" y="36" class="title">E2E 품질 검증 흐름</text>

  <!-- Step 1: e2e + Playwright -->
  <g transform="translate(32, 60)" filter="url(#cardShadow)">
    <rect width="235" height="145" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <rect width="235" height="4" rx="2" fill="url(#step1Grad)" />
    
    <text x="18" y="32" class="step-tag" fill="#38bdf8">STEP 01</text>
    <text x="18" y="56" class="card-title">기능 및 시나리오</text>
    
    <!-- Tool Badge -->
    <rect x="18" y="74" width="148" height="24" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="28" y="90" class="tool-badge" fill="#38bdf8">e2e + Playwright</text>

    <text x="18" y="124" class="card-desc">자연어 목표 탐색 및 로케이터 검증</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="282" y1="132" x2="310" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: axe-core -->
  <g transform="translate(322, 60)" filter="url(#cardShadow)">
    <rect width="235" height="145" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <rect width="235" height="4" rx="2" fill="url(#step2Grad)" />
    
    <text x="18" y="32" class="step-tag" fill="#c084fc">STEP 02</text>
    <text x="18" y="56" class="card-title">웹 접근성 감사</text>
    
    <!-- Tool Badge -->
    <rect x="18" y="74" width="88" height="24" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1" />
    <text x="28" y="90" class="tool-badge" fill="#c084fc">axe-core</text>

    <text x="18" y="124" class="card-desc">WCAG 가이드라인 및 a11y 표준 검사</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="572" y1="132" x2="600" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: k6 -->
  <g transform="translate(612, 60)" filter="url(#cardShadow)">
    <rect width="235" height="145" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <rect width="235" height="4" rx="2" fill="url(#step3Grad)" />
    
    <text x="18" y="32" class="step-tag" fill="#34d399">STEP 03</text>
    <text x="18" y="56" class="card-title">부하 및 성능 테스트</text>
    
    <!-- Tool Badge -->
    <rect x="18" y="74" width="46" height="24" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1" />
    <text x="28" y="90" class="tool-badge" fill="#34d399">k6</text>

    <text x="18" y="124" class="card-desc">동시 접속 트래픽 및 응답 임계치 측정</text>
  </g>
</svg>
